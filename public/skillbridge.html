<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillBridge — Career Readiness Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--surf:#ffffff;--surf2:#fbfbfc;--tx:#12141a;--mut:#68707e;--mut2:#8b93a1;--ac:#3452eb;--acsoft:#ecefff;--bd:#e7e9ee;--ok:#158a52;--bad:#c92f2f;--ring:#e7e9ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d10;--surf:#141519;--surf2:#191a1f;--tx:#f3f4f7;--mut:#9aa1ad;--mut2:#767d89;--ac:#7c8cff;--acsoft:#1c2040;--bd:#24262d;--ok:#3ddc84;--bad:#ff6b6b;--ring:#24262d}}
:root[data-theme="dark"]{--bg:#0c0d10;--surf:#141519;--surf2:#191a1f;--tx:#f3f4f7;--mut:#9aa1ad;--mut2:#767d89;--ac:#7c8cff;--acsoft:#1c2040;--bd:#24262d;--ok:#3ddc84;--bad:#ff6b6b;--ring:#24262d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Inter',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:14.5px;font-weight:600}
.mut{color:var(--mut);font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut2)}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
a{color:var(--ac);text-decoration:none}

.shell{display:flex;min-height:100vh}
.sidebar{display:none}
main{flex:1;min-width:0;padding:16px 14px 92px;max-width:900px;margin:0 auto;width:100%}
@media (min-width:900px){
  .sidebar{display:flex;flex-direction:column;width:236px;flex:none;background:var(--surf);border-right:1px solid var(--bd);padding:22px 14px;position:sticky;top:0;height:100vh;gap:4px}
  .bottomnav{display:none}
  main{padding:32px 44px 60px;max-width:1080px}
}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 22px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--ac);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.brand b{font-size:15px;font-weight:800}
.snav a,.snav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;color:var(--mut);font:600 13.5px 'Inter',sans-serif;padding:9px 10px;border-radius:9px;cursor:pointer}
.snav button.on{background:var(--acsoft);color:var(--ac)}
.snav button:hover:not(.on){background:var(--surf2);color:var(--tx)}
.snav .ic{width:18px;height:18px;flex:none}
.sidefoot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--bd)}

.bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surf);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.bottomnav button{flex:1;border:0;background:none;color:var(--mut2);font:600 10.5px 'Inter',sans-serif;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottomnav button.on{color:var(--ac)}
.bottomnav svg{width:20px;height:20px}

.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:0 0 14px;animation:up .28s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.card:hover .hoverable{opacity:1}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(4,1fr)}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}

button.p,button.s,button.gh{font:600 13.5px 'Inter',sans-serif;padding:10px 16px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:filter .12s,background .12s}
button.p{background:var(--ac);color:#fff}button.p:hover{filter:brightness(1.08)}
button.s{background:var(--surf2);color:var(--tx);border-color:var(--bd)}button.s:hover{background:var(--acsoft)}
button.gh{background:none;color:var(--ac);padding:8px 4px}
button:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--surf2);color:var(--tx);font:14px 'Inter',sans-serif;margin:6px 0}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--acsoft);border-color:var(--ac)}

.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.iconbox{width:38px;height:38px;border-radius:10px;background:var(--acsoft);color:var(--ac);display:grid;place-items:center;flex:none}

.pbar{height:7px;background:var(--ring);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .5s ease}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--ring) 0);display:grid;place-items:center;flex:none}
.ring b{width:74px;height:74px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-size:20px}
.ringsm{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--ring) 0);display:grid;place-items:center;flex:none}
.ringsm b{width:35px;height:35px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-size:11px;font-weight:700}

.chip{display:inline-flex;align-items:center;gap:4px;background:var(--acsoft);color:var(--ac);padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:700}
.badge{background:var(--surf2);color:var(--mut);border:1px solid var(--bd);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}

.mod{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--bd)}
.mod:first-child{border-top:none;padding-top:2px}
.lesrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--bd);cursor:pointer}
.lesrow:first-child{border-top:none}
.lesrow:hover{background:var(--surf2);border-radius:8px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);flex:none;display:grid;place-items:center}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.done svg{width:11px;height:11px;stroke:#fff;stroke-width:3}

.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin:6px 0;border:1.5px solid var(--bd);border-radius:10px;background:var(--surf);color:var(--tx);font:14px 'Inter',sans-serif;cursor:pointer}
.opt:hover{border-color:var(--ac)}
.opt.sel{border-color:var(--ac);background:var(--acsoft)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surf))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surf))}
.optlet{width:22px;height:22px;border-radius:6px;background:var(--surf2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:1px solid var(--bd)}

.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin:10px 0}
.pal button{aspect-ratio:1;border-radius:7px;border:1px solid var(--bd);background:var(--surf2);color:var(--mut);font:700 11.5px 'Inter',sans-serif;cursor:pointer;position:relative}
.pal button.cur{border-color:var(--ac);box-shadow:0 0 0 2px var(--acsoft)}
.pal button.ans{background:var(--acsoft);color:var(--ac);border-color:var(--ac)}
.pal button.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#e8a917}

.pill{display:inline-flex;gap:4px;border:1px solid var(--bd);background:var(--surf2);color:var(--mut);padding:8px 14px;border-radius:20px;font:600 12.5px 'Inter',sans-serif;cursor:pointer}
.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pillrow{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.diffrow{display:flex;gap:6px;flex-wrap:wrap}
.diffrow button{border:1px solid var(--bd);background:var(--surf2);color:var(--tx);padding:6px 12px;border-radius:16px;font:600 12px 'Inter',sans-serif;cursor:pointer}
.diffrow button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.pricecard{border:1.5px solid var(--bd);border-radius:14px;padding:18px;position:relative}
.pricecard.best{border-color:var(--ac)}
.pricecard .rec{position:absolute;top:-10px;right:14px;background:var(--ac);color:#fff;font:700 10.5px 'Inter',sans-serif;padding:3px 9px;border-radius:8px}
.feat{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:13.5px}
.feat svg{width:15px;height:15px;margin-top:2px;flex:none;color:var(--ok)}

.lockpanel{text-align:center;padding:44px 16px}
.lockpanel .iconbox{margin:0 auto 14px}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:20;max-width:88%;display:flex;align-items:center;gap:8px;transition:transform .25s ease,opacity .25s ease;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media (min-width:900px){#toast{bottom:22px}}
#toast svg{width:15px;height:15px;color:#3ddc84;flex:none}

pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,monospace;background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:12px}
ul{padding-left:18px;margin:6px 0}
</style></head><body>
<div class="shell">
<aside class="sidebar" id="sidebar"></aside>
<main id="app"></main>
</div>
<nav class="bottomnav" id="bnav"></nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S={plans:{ai:false,test:false,cv:false,full:false},done:{},les:{},certs:[],certDone:{},domain:"",tests:{},cv:"",cvRes:null,cvBest:0,made:false,maker:null,co:"",role:"",jd:"",name:"",streak:0,lastActive:"",topicStats:{},calib:null};
try{Object.assign(S,JSON.parse(localStorage.getItem("sb2")||"{}"))}catch(e){}
const has=k=>S.plans.full||S.plans[k];
const save=()=>{try{localStorage.setItem("sb2",JSON.stringify(S))}catch(e){}};
let toastT;
function toast(m){const t=$("#toast");t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>${esc(m)}`;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),3200)}
function bumpStreak(){const today=new Date().toISOString().slice(0,10);if(S.lastActive===today)return;const y=new Date(Date.now()-86400000).toISOString().slice(0,10);S.streak=S.lastActive===y?(S.streak||0)+1:1;S.lastActive=today;save()}
bumpStreak();

// ---------- icons ----------
const ICONS={
 dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
 check:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/>',
 file:'<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M9 13h6M9 17h6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4 5-6 8-6s6.6 2 8 6"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 award:'<circle cx="12" cy="8" r="5"/><path d="M8.5 12.5 7 21l5-3 5 3-1.5-8.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
 arrow:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
 flag:'<path d="M5 3v18"/><path d="M5 4h11l-2.5 4L16 12H5"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>',
 trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 6h6v6"/>',
 brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 check2:'<path d="M20 6 9 17l-5-5"/>'};
const ic=(n,cls="ic")=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||""}</svg>`;

// ---------- readiness ----------
const nD=()=>Object.keys(S.done).length,nC=()=>Object.keys(S.certDone).length,nT=()=>Object.keys(S.tests).length;
const R=()=>Math.min(100,10+nD()*2+nC()*3+nT()*4+Math.round((S.cvBest||0)*.2)+(S.made?11:0)+(S.calib&&S.calib.status==="ready"?6:0));
const readyMsg=r=>r<25?"You're just getting started — build your foundation.":r<50?"You're making solid progress toward being interview-ready.":r<75?"Your profile is becoming interview-ready.":r<100?"Almost there — a few milestones left.":"You're fully career-ready. Keep your resume current.";
function commit(prev,label){save();const n=R();if(n>prev)toast(`${label} — readiness now ${n}%`);render()}

async function ai(prompt,q){
  try{
    const r=await fetch("/api/public/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
    if(!r.ok)throw new Error("AI request failed");
    return await r.json();
  }catch(e){if(!q)toast("AI request failed — try again");throw e}
}

// ---------- learning content ----------
const M=[["01 — AI & Career Fundamentals",[
["What AI, ML and Generative AI really are","difference between AI, machine learning, deep learning and generative AI; real examples like UPI fraud detection, Netflix recommendations, ChatGPT/Claude"],
["How LLMs work: tokens, context and hallucination","tokens, context windows, training vs inference, why models hallucinate, how to verify outputs, examples of confident wrong answers"],
["The AI tools landscape and how to choose","chat assistants (Claude, ChatGPT, Gemini), Copilot, image/video tools, NotebookLM, coding tools; a decision framework by task, cost, privacy"],
["Responsible AI, ethics and AI careers","bias, privacy, academic integrity, copyright, and the roles AI creates (prompt engineer, AI analyst, automation specialist) with skills and salary ranges in India"]]],
["02 — Prompt Engineering",[
["The RCTF framework: Role, Context, Task, Format","weak vs strong prompt comparisons with full before/after examples for a student and a startup founder"],
["Few-shot, chain-of-thought and constraints","how to give examples, request step-by-step reasoning, set constraints and tone; worked maths and marketing examples"],
["Prompts for studying, work and job hunting","prompt templates for summarising notes, mock interviews, cover letters, resume bullet rewriting, market research, with sample outputs"],
["Iterate, evaluate and build a prompt library","how to critique outputs, A/B test prompts, keep reusable templates, and avoid common mistakes; include a checklist"]]],
["03 — Business Process Automation",[
["Finding processes worth automating (ROI)","how to map trigger-steps-output, score tasks by frequency and risk, calculate hours saved x hourly value; example: invoice reminders at a small business"],
["No-code tools: Zapier, Make, n8n, Apps Script","how each tool works, when to pick which, pricing tiers, and a step-by-step example flow: Google Form to Sheet to Gmail to WhatsApp alert"],
["AI agents and smart workflows","difference between automation, AI workflows and agents; example: email triage that classifies, drafts replies and logs tasks; human-in-the-loop"],
["Build, test, govern and pitch your automation","testing edge cases, logging, security of API keys, measuring results, and packaging a portfolio project or freelance offer with pricing"]]]];
const TOP=M.flatMap((m,i)=>m[1].map((t,j)=>({id:i+"-"+j,m:m[0],t:t[0],h:t[1]})));
const TESTS=[{n:"Set 1 · Foundation",c:"TCS NQT, Infosys, Wipro",d:"easy-to-moderate"},{n:"Set 2 · Intermediate",c:"Cognizant, Capgemini, Accenture",d:"moderate"},{n:"Set 3 · Consulting & Analytics",c:"Deloitte, EY, KPMG, Mu Sigma",d:"moderate-to-hard"},{n:"Set 4 · Big Tech",c:"Amazon, Microsoft, Flipkart",d:"hard"},{n:"Set 5 · Elite",c:"Google, McKinsey/BCG-style, CAT",d:"very hard"}];
const SECS=[["Quant","quantitative aptitude (arithmetic, algebra, P&C, probability)"],["LRDI","logical reasoning and data interpretation (puzzles, arrangements, text tables)"],["Verbal","verbal ability (mini reading passages, para-jumbles, grammar, vocabulary)"]];
const TOPICS=["Percentages","Profit & Loss","Time & Work","Speed, Time & Distance","Number Systems","Probability"];

// ---------- nav ----------
const TABS=[["dashboard","dashboard","Dashboard"],["learning","book","Learning"],["assessments","check","Assessments"],["resume","file","Resume"],["profile","user","Profile"]];
let tab=(S.plans.ai||S.plans.test||S.plans.cv||S.plans.full)?"dashboard":"dashboard",busy="",quiz=null,cur=null,subL="course",subA="tests",subR="score";

function render(){
  $("#sidebar").innerHTML=`<div class="brand"><div class="mark">SB</div><b>SkillBridge</b></div><div class="snav">${TABS.map(([k,i,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${ic(i,"ic")}${l}</button>`).join("")}</div><div class="sidefoot"><div class="row" style="padding:10px 6px"><div class="ringsm" style="--p:${R()}"><b>${R()}%</b></div><div style="font-size:12px;color:var(--mut)">Career<br>readiness</div></div></div>`;
  $("#bnav").innerHTML=TABS.map(([k,i,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${ic(i,"ic")}<span>${l}</span></button>`).join("");
  ({dashboard,learning,assessments,resume,profile})[tab]();
  save();
}
function go(k){tab=k;quiz=null;cur=null;render();scrollTo(0,0)}
function paywall(key,title,desc){$("#app").innerHTML=`<div class="card lockpanel"><div class="iconbox">${ic("lock")}</div><h2>${title}</h2><p class="mut" style="max-width:340px;margin:8px auto 18px">${desc}</p><button class="p" onclick="go('profile')">View plans</button></div>`}

// ---------- Dashboard ----------
function nextLesson(){return TOP.find(t=>!S.done[t.id])}
function recommend(){
  if(has("ai")){const n=nextLesson();if(n)return{label:"Continue learning",title:n.t,sub:n.m,cta:"Continue",go:()=>{go('learning');subL='course';openL(n.id)}}}
  if(has("test")){const i=TESTS.findIndex((t,k)=>S.tests[k]==null);if(i>=0)return{label:"Recommended next step",title:TESTS[i].n,sub:"30 questions · Quant, LRDI & Verbal",cta:"Start test",go:()=>{go('assessments');subA='tests'}}}
  if(has("cv")&&!S.cvBest)return{label:"Recommended next step",title:"Analyse your resume",sub:"Get an ATS readiness score in under a minute",cta:"Analyse now",go:()=>{go('resume');subR='score'}};
  if(has("cv")&&!S.made)return{label:"Recommended next step",title:"Tailor your resume for a role",sub:"Match a job description's keywords",cta:"Open resume builder",go:()=>{go('resume');subR='tailor'}};
  if(calibEligible()&&!(S.calib&&S.calib.status==="ready"))return{label:"Bonus milestone unlocked",title:"Your Career, Reviewed by a Human.",sub:"Career Calibration — focused feedback from an experienced hiring perspective",cta:"Get My Career Calibrated",go:()=>calibration()};
  if(!has("ai")&&!has("test")&&!has("cv"))return{label:"Get started",title:"Unlock your first module",sub:"Choose a plan to begin building your career readiness",cta:"View plans",go:()=>go('profile')};
  return{label:"You're all caught up",title:"Every unlocked module is complete",sub:"Revisit any section to sharpen your score further",cta:"Explore",go:()=>go('learning')};
}
function dashboard(){
  const r=R(),rec=recommend(),hr=new Date().getHours(),greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  const cats=[["AI & Career Fundamentals",has("ai")?Math.round(nD()/12*100):0,"learning"],["Aptitude & Assessments",has("test")?Math.round(nT()/5*100):0,"assessments"],["Resume",S.cvBest||0,"resume"],["Application Prep",S.made?100:0,"resume"]];
  $("#app").innerHTML=`
  <div class="card grid2" style="align-items:center">
    <div>
      <div class="label">${S.name?esc(S.name):"Welcome back"}</div>
      <h1 style="margin-top:4px">${greet}${S.name?", "+esc(S.name):""}.</h1>
      <p class="mut" style="margin-top:6px;max-width:380px">${readyMsg(r)}</p>
      <button class="p" style="margin-top:14px" onclick="(${recToJs(rec)})()">${esc(rec.cta)} ${ic("arrow","ic")}</button>
    </div>
    <div style="text-align:center"><div class="ring" style="--p:${r};margin:0 auto"><b class="num">${r}%</b></div><div class="label" style="margin-top:8px">Career readiness</div></div>
  </div>
  <div class="card">
    <div class="row"><div class="label">${esc(rec.label)}</div></div>

}
const CURATED_LESSONS={"0-0": {"intro": "Artificial Intelligence is the umbrella term for software that performs tasks normally requiring human judgement — recognising a face, translating a sentence, recommending a show. Machine Learning (ML) is the dominant way we build AI today: instead of writing explicit rules, we show a system thousands of examples and let it find the patterns itself. Generative AI is a newer branch of ML that doesn't just classify or predict — it creates new text, images, code, or audio that didn't exist before, which is why tools like ChatGPT and Claude feel so different from older 'AI' like a spam filter.", "purpose": "Every other lesson in this course assumes you can tell these three terms apart. Recruiters, product teams, and even LinkedIn job descriptions now use 'AI', 'ML', and 'GenAI' almost interchangeably — often incorrectly. Getting this right is the difference between sounding informed in an interview and sounding like you've only read headlines.", "outcomes": ["Explain the real relationship between AI, ML, and Generative AI without using circular definitions", "Identify which category a given tool or product actually belongs to", "Recognise the specific capability that makes generative models different from classic ML", "Spot common misuses of these terms in job postings and news articles"], "content": [{"h": "AI is the goal, ML is the method", "p": "AI is the broad ambition of building machines that act intelligently. ML is currently the most successful method for getting there: a model is trained on data, adjusts millions of internal parameters to reduce its errors, and ends up able to generalise to new, unseen inputs. A credit card fraud detector, a Netflix recommendation engine, and a UPI fraud alert are all narrow ML — each trained for one specific job and not able to do anything else."}, {"h": "Generative AI changed what 'output' means", "p": "Classic ML mostly does two things: predict a number (will this loan default?) or pick a category (is this email spam?). Generative AI produces open-ended content — a paragraph, an image, a block of code — by predicting, one small unit at a time, what should plausibly come next given everything before it. This single shift is why generative tools can write an email, debug code, and explain a concept, while a fraud detector can only ever say 'fraud' or 'not fraud'."}, {"h": "Why this distinction actually matters at work", "p": "A company that says it 'uses AI' for hiring might mean a 1990s-style rule engine, a modern ML resume scorer, or a generative tool that drafts interview questions — and each has completely different risks, costs, and capabilities. Being able to ask 'which kind of AI, specifically?' is one of the fastest ways to sound credible in a technical conversation, whether you're in an interview or reviewing a vendor's pitch."}], "examples": ["A spam filter (classic ML, decades old) sorts email into two buckets using patterns learned from millions of past emails — it cannot write you a new email.", "An AI image generator (generative AI) is not sorting or predicting a single label; it is producing an entirely new image, pixel by pixel, based on patterns learned from millions of image–caption pairs.", "A resume-screening tool that just checks for keyword matches is closer to a rules engine dressed up as 'AI' than to real ML — a good interview question is to ask how it was actually trained."], "conclusion": "Once you stop treating 'AI' as one single thing, you can ask sharper questions about any product, job description, or tool you encounter — and that habit compounds across every other lesson in this course.", "projects": {"overview": "The strongest beginner project for this topic isn't building a model — it's building your own clear map of the AI landscape that you can reuse and reference for months.", "caseStudy": {"title": "The 'AI Landscape Map' project", "body": "Pick 6 AI-powered tools you already use or have heard of (e.g. Claude, a Netflix recommendation, Google Maps ETA prediction, an AI resume scanner, Grammarly, a UPI fraud alert). For each one, research and write one paragraph identifying: is it classic ML or generative AI, what data it likely learned from, and what its single biggest limitation is. This forces you to apply the AI vs ML vs GenAI distinction to real products instead of abstract theory."}, "ideal": ["A one-page 'AI Landscape Map' comparing 6 real tools by category, training data, and limitation", "A short video (2-3 minutes) explaining the AI/ML/GenAI distinction using only everyday apps as examples"]}, "linkedin": {"task": "Publish your 'AI Landscape Map' as a LinkedIn post: a short intro (2-3 lines) on why the AI/ML/GenAI distinction matters, followed by your 6-tool comparison as a clean bulleted list.", "why": "Most students' LinkedIn posts about AI are vague enthusiasm ('AI is the future!'). A specific, well-researched comparison signals that you can think critically about technology rather than just consume headlines — recruiters and hiring managers notice the difference immediately, and it gives you a concrete, linkable artifact to reference in interviews."}}, "0-1": {"intro": "Large Language Models don't read words the way you do — they read tokens, small chunks of text roughly 4 characters or three-quarters of a word each. Every model also has a context window: a hard limit on how many tokens it can 'see' at once, covering your instructions, the conversation history, and its own reply combined. Understanding these two mechanics explains almost every strange thing LLMs do, including hallucination — when a model states something false with full confidence.", "purpose": "Prompt engineering, AI tool selection, and even basic troubleshooting ('why did it forget what I said earlier?') are all downstream of understanding tokens, context windows, and hallucination. Skipping this lesson means every other AI skill you learn will feel like guesswork instead of engineering.", "outcomes": ["Explain what a token is and roughly how many tokens fit in a page of text", "Describe what a context window is and why it's shared between input and output", "Explain hallucination as a mechanical consequence of how LLMs generate text, not a random glitch", "Predict when a long conversation is likely to cause a model to 'forget' earlier instructions"], "content": [{"h": "Tokens: the model's real unit of reading", "p": "As a working rule, one token is about 4 characters or 0.75 words in English, so roughly 750 words fill about 1,000 tokens. Modern flagship models in 2026 (including Claude and GPT-5-class models) support context windows from around 200,000 tokens up to 1 million tokens — enough to hold a very long document, but still a hard ceiling, not infinite memory."}, {"h": "The context window is shared, not separate", "p": "Your instructions, any documents you paste in, the entire back-and-forth conversation so far, and the model's own response all draw from the same token budget. If a 1-million-token model already has 990,000 tokens of conversation history, it only has 10,000 tokens left to write its answer — and if you keep going past the limit, the oldest parts of the conversation get silently dropped or compressed, not stored elsewhere."}, {"h": "Hallucination is prediction, not lying", "p": "An LLM does not look facts up in a database — it predicts the next most statistically plausible token based on patterns learned during training. When a fact isn't well represented in what it currently has 'in view' (its context), it doesn't say 'I don't know' by default; it generates something that sounds right because it's completing a familiar pattern. This is also why an instruction you gave early in a very long chat can quietly get ignored once it scrolls out of the effective context — the model isn't being careless, it genuinely can no longer see it."}], "examples": ["You give a 200-word chatbot instruction at the very start of a 3-hour conversation. By hour two, the model starts ignoring that instruction — not because it's broken, but because your instruction has been pushed out of its usable context by everything said since.", "You ask an LLM for a statistic it wasn't trained on and hasn't been given in the conversation. Instead of saying 'I don't have that data,' it may generate a plausible-sounding number — a classic hallucination caused by a genuine gap, filled with a confident guess.", "You paste a 40-page PDF and ask a question about page 2. If the model's context window is large enough to hold the whole document, it can answer accurately — the moment the document exceeds that window, the earliest pages may already be cut or compressed before it even starts answering."], "conclusion": "Once you think of an LLM as 'a system with a fixed-size working memory that predicts plausible text,' most of its weird behaviour — forgetting, confidently inventing facts, drifting off-topic in long replies — stops being mysterious and starts being predictable, which is the whole point of learning this mechanically rather than magically.", "projects": {"overview": "The best way to internalise hallucination is to deliberately trigger it, document it, and explain why it happened — this is more valuable than reading ten more articles about it.", "caseStudy": {"title": "The 'Hallucination Hunter' project", "body": "Ask any AI chatbot 5 different questions specifically designed to expose gaps: an obscure statistic, a very recent event, a fabricated-sounding but plausible question ('what is the population of a real but small town you're unsure it knows'), a long-context memory test, and a math question requiring exact precision. Document each response, mark whether it hallucinated, and write one sentence explaining the mechanical reason (context loss vs. genuine knowledge gap vs. plausible-pattern completion)."}, "ideal": ["A 5-case 'Hallucination Hunter' report with screenshots and mechanical explanations for each", "A short comparison testing the same 5 questions across two different AI tools to see which handles uncertainty better"]}, "linkedin": {"task": "Post your Hallucination Hunter findings on LinkedIn as a short 'AI literacy' breakdown: one question that caused a hallucination, the model's exact wrong answer, and your one-line explanation of why it happened mechanically.", "why": "This positions you as someone who understands AI's limitations, not just its capabilities — a rarer and more valuable signal to employers than generic AI enthusiasm, since it shows you can evaluate AI output critically rather than trust it blindly, which is exactly the skill companies deploying AI tools are hiring for right now."}}, "0-2": {"intro": "By 2026 the AI tools landscape has split into clear categories: general chat assistants (Claude, ChatGPT, Gemini), coding-focused tools (GitHub Copilot, Cursor), research and document tools (NotebookLM, Perplexity), and image/video generators. Picking the right tool for a task — rather than defaulting to whichever one is most hyped — is itself a skill, and it's one recruiters increasingly expect from anyone claiming 'AI literacy' on a resume.", "purpose": "Nobody has time to master every AI tool that launches. This lesson gives you a repeatable decision framework so that when a new tool appears (and one will, every few months), you can evaluate it in minutes instead of starting from zero.", "outcomes": ["Categorise any AI tool into one of 4-5 functional groups based on what it actually does", "Apply a simple decision framework (task, cost, privacy) to choose between tools", "Identify when a general chat assistant is the wrong tool for a specific task", "Explain at least one privacy or data-handling consideration relevant to choosing an AI tool"], "content": [{"h": "The main categories in 2026", "p": "General assistants (Claude, ChatGPT, Gemini) handle writing, reasoning, and analysis across almost any topic. Coding assistants (Cursor, GitHub Copilot) are embedded directly into a developer's editor and specialise in reading and writing code in context. Research and document tools (NotebookLM, Perplexity) are built to ground answers in specific sources you provide or search, reducing hallucination for fact-heavy work. Generation tools handle images, video, or audio rather than text. Knowing which bucket a tool falls into tells you 80% of what you need to know before trying it."}, {"h": "A decision framework: task, cost, privacy", "p": "Task: does this tool need to reason and write flexibly (general assistant), work inside real code (coding tool), or stay grounded in specific documents (research tool)? Cost: many powerful tools have a genuinely useful free tier, but heavy or professional use often requires a paid plan — factor this in before building a habit around a tool you can't sustain. Privacy: sensitive data (client information, unpublished research, personal documents) should only go into tools with a clear, trustworthy data-handling policy — free tools are not automatically less private, and paid tools are not automatically more private; you have to actually check."}, {"h": "Choosing wrong is a common, avoidable mistake", "p": "A frequent error is using a general chat assistant for a task that genuinely needs grounding in real, current sources (like legal or medical research) instead of a retrieval-based tool, or using a heavy general assistant for a simple, repetitive task that a smaller, cheaper, specialised tool would handle just as well and faster."}], "examples": ["Drafting a persuasive cover letter → a general assistant like Claude or ChatGPT, since it needs flexible, creative reasoning about your specific situation.", "Debugging a specific error in your own codebase → a coding-embedded tool like Cursor, since it can see your actual file structure and surrounding code, not just a description of it.", "Summarising 10 research papers you've collected → a document-grounded tool like NotebookLM, since it answers strictly from the sources you gave it rather than from general training data, reducing the risk of confidently wrong summaries."], "conclusion": "Tool literacy isn't about knowing the most tools — it's about correctly matching a small number of categories to the actual shape of your task, which is a skill that survives every new product launch.", "projects": {"overview": "Rather than testing tools randomly, build a decision reference you'll actually reuse the next time you're unsure which AI tool fits a task.", "caseStudy": {"title": "The 'Right Tool, Right Task' matrix", "body": "Take 5 real tasks from your own coursework, job search, or side project (e.g. 'summarise my textbook chapter,' 'fix this Python bug,' 'draft a LinkedIn post'). For each, pick the best-fit tool category using the task/cost/privacy framework, try it, and record whether the result confirmed your choice or revealed you'd picked the wrong category."}, "ideal": ["A personal 'Right Tool, Right Task' reference matrix covering at least 5 real tasks with your reasoning", "A short before/after comparison showing the same task done with a mismatched tool vs. the correctly matched one"]}, "linkedin": {"task": "Share your 'Right Tool, Right Task' matrix on LinkedIn as a practical resource post: 5 tasks, the tool category you'd use for each, and a one-line reason why.", "why": "Posts that offer a genuinely reusable framework (rather than a tool review) tend to get saved and shared, and they demonstrate structured thinking about AI adoption — a skill increasingly listed in job descriptions as 'AI tool fluency,' which most applicants can't actually demonstrate with evidence the way this post does."}}, "0-3": {"intro": "AI systems inherit the biases in their training data, can be used to generate convincing misinformation, and raise real questions about privacy, copyright, and academic integrity. None of this means avoiding AI — it means using it with the same professional judgement you'd apply to any powerful tool, and it's also opening entirely new career paths: prompt engineer, AI product manager, AI ethics analyst, and automation specialist are now real, paid roles, not speculative titles.", "purpose": "Employers increasingly screen for responsible AI use, not just AI skill — using AI carelessly (leaking confidential data into a public chatbot, submitting AI-generated work as entirely your own) can end internships and careers. This lesson gives you the judgement layer that sits on top of every technical AI skill in this course.", "outcomes": ["Identify at least 3 concrete ethical risks of AI use in a professional or academic setting", "Explain why AI bias is a data problem, not just a technical bug", "Apply a simple rule for what should never be pasted into a public AI tool", "Name at least 3 emerging AI-related career roles and the core skill each one requires"], "content": [{"h": "Bias comes from data, not malice", "p": "An AI model trained mostly on historical hiring decisions will learn whatever biases existed in those decisions — it doesn't invent bias, it reproduces and sometimes amplifies what's already in the data it's shown. This is why 'the AI decided it' is not an acceptable excuse in a professional setting; someone chose the training data and deployed the system, and accountability sits with people, not the model."}, {"h": "Privacy and confidentiality are your responsibility, not the tool's", "p": "A simple professional rule: never paste anything into a public AI tool that you wouldn't be comfortable posting publicly — client data, unpublished financials, personal medical information, or another person's private messages. Many organisations now have explicit AI usage policies for exactly this reason, and violating one (even accidentally) is treated as a real compliance issue."}, {"h": "New roles are opening faster than most people realise", "p": "Prompt engineers design and refine the exact instructions that make AI systems reliable for a specific business use case. AI product managers decide which AI features are worth building and how to measure if they actually work. AI ethics analysts and auditors review systems for bias, safety, and compliance before and after deployment. Automation specialists combine AI with no-code tools to redesign business workflows. None of these require being a machine learning researcher — they require judgement, communication, and enough technical fluency to work credibly alongside engineers."}], "examples": ["A hiring algorithm trained on 10 years of a company's past hires quietly learns to favour candidates similar to those past hires — even with gender and race removed, proxies like college name or address can reconstruct the same pattern.", "A student pastes a friend's private WhatsApp messages into a public chatbot to 'get advice on how to reply' — this is a privacy breach even though no one else technically sees it, because the data has now left the student's control and entered a third party's system.", "A mid-size company hires its first 'AI Program Manager' — not to build models, but to decide which of 15 proposed AI use cases are worth funding, and to make sure each one is measured for real business impact rather than treated as a magic fix."], "conclusion": "Responsible AI use isn't a separate 'ethics module' you check off — it's a professional habit, and it's also one of the clearest ways to differentiate yourself from peers who can use AI tools but haven't thought about when not to.", "projects": {"overview": "The goal here isn't a technical build — it's demonstrating professional judgement about AI, which is exactly what's hard to fake and valuable to show employers.", "caseStudy": {"title": "The 'AI Use Policy' project", "body": "Write a one-page personal or team AI usage policy: what kinds of data you will never paste into a public AI tool, how you'll disclose AI assistance in academic or work submissions, and how you'll double-check AI output before relying on it. Then apply it retroactively — review your last 10 AI interactions against your own policy and note where you would have done something differently."}, "ideal": ["A one-page personal 'AI Use Policy' with a retroactive review of your own past AI usage", "A short comparison of 2 real companies' public AI usage policies, noting what they cover well and what they leave vague"]}, "linkedin": {"task": "Post your personal AI Use Policy on LinkedIn with a short intro explaining why you wrote it — frame it as a professional standard you hold yourself to, not a rulebook forced on you.", "why": "This is a rare, high-signal post: almost no student-level LinkedIn profile shows evidence of thinking seriously about AI responsibility, so it stands out to recruiters specifically screening for judgement, not just technical skill, and it gives you a strong, specific talking point for interview questions about AI ethics."}}, "1-0": {"intro": "Most disappointing AI answers come from vague prompts, not weak models. The RCTF framework — Role, Context, Task, Format — is a simple structure (closely related to frameworks like CO-STAR and CRAFT used across the industry) that forces you to specify exactly what a general-purpose assistant needs to give you a genuinely useful, specific answer instead of a generic one.", "purpose": "This is the single highest-leverage skill in this entire course. Nearly every other lesson — from resume tailoring to interview prep — becomes dramatically more effective once you can write a well-structured prompt instead of a vague one.", "outcomes": ["Write a prompt that specifies Role, Context, Task, and Format explicitly", "Explain why 'write about marketing' produces worse results than a fully specified RCTF prompt", "Identify which of the four RCTF elements is missing when an AI response is too generic", "Convert a vague, real request of your own into a complete RCTF prompt"], "content": [{"h": "Role: who should the AI act as?", "p": "Assigning a role ('You are a senior recruiter reviewing 200 resumes a week') focuses the model's tone, priorities, and vocabulary far more than leaving it unspecified. Without a role, the model defaults to a generic, safe, middle-of-the-road voice — useful sometimes, but rarely sharp or specific."}, {"h": "Context: what does the AI need to know?", "p": "Context is the background information a human expert would ask for before giving real advice: your industry, your constraints, your audience, relevant numbers. Skipping context is the single most common reason AI advice feels generic — the model isn't wrong, it's answering a different, more general question than the one you actually meant to ask."}, {"h": "Task and Format: what exactly, and shaped how?", "p": "Task should be a specific, unambiguous action ('list 5 campaign ideas' beats 'help with marketing'). Format tells the model how to shape the answer — a table, a word limit, bullet points, a specific tone — and this alone often has a bigger impact on usability than people expect, because it's the difference between an answer you can use immediately and one you have to rewrite yourself."}], "examples": ["Weak prompt: 'Write about marketing.' — Strong RCTF prompt: 'You are a B2C growth marketer (Role). Context: a Chennai-based bike-pooling startup with a ₹20,000 monthly budget and a college-student audience (Context). Task: suggest 5 campaign ideas (Task). Format: a table with estimated cost and expected reach for each (Format).'", "Weak prompt: 'Help me study for my exam.' — Strong RCTF prompt: 'You are a strict but supportive tutor (Role). Context: I'm a second-year commerce student and my exam covers cost accounting formulas (Context). Task: quiz me with 5 questions, one at a time, and explain any wrong answer before moving on (Task). Format: one question per message (Format).'", "A prompt missing only Format still often works but requires manual reformatting afterward — a small cost, but one that adds up across dozens of prompts a day."], "conclusion": "RCTF isn't a rigid script to recite — it's a checklist. Once you can mentally scan any AI request for a missing Role, Context, Task, or Format, you'll instinctively write better prompts even without stopping to label each part.", "projects": {"overview": "The fastest way to internalise RCTF is a direct before/after comparison using your own real requests, not textbook examples.", "caseStudy": {"title": "The 'Before/After Prompt Rewrite' project", "body": "Take 5 real prompts you've actually typed into an AI tool recently. For each, write down the original, identify which RCTF elements were missing, rewrite it as a complete RCTF prompt, and run both versions to compare the actual outputs side by side."}, "ideal": ["A 5-prompt before/after comparison document showing original vs. RCTF-rewritten prompts and outputs", "A personal 'prompt starter' template library covering your 3 most common use cases (study help, job search, writing)"]}, "linkedin": {"task": "Post one strong before/after example from your project on LinkedIn: the weak prompt, the RCTF-rewritten version, and a short explanation of which element made the biggest difference.", "why": "This kind of post demonstrates a specific, teachable skill rather than a vague claim of 'AI experience' — it's concrete enough that a hiring manager scanning your profile can immediately see you know how to get reliable results from AI tools, which is now a genuinely screened-for skill across many entry-level roles."}}, "1-1": {"intro": "Beyond basic RCTF prompting, three techniques handle harder problems: few-shot prompting (showing examples instead of describing what you want), chain-of-thought prompting (asking the model to reason step by step), and explicit constraints (rules the output must follow). Used well, these three techniques handle the vast majority of professional prompting challenges you'll encounter.", "purpose": "Simple instructions eventually stop working as your tasks get more specific or complex — this lesson gives you the next level of technique for exactly those moments, rather than leaving you stuck rephrasing the same vague request repeatedly.", "outcomes": ["Apply few-shot prompting by providing 2-5 well-chosen examples instead of a description", "Apply chain-of-thought prompting to a task that requires logic or multi-step reasoning", "Write explicit constraints that shape an AI's output (length, tone, exclusions)", "Decide which of the three techniques fits a given task, or when to combine them"], "content": [{"h": "Few-shot: show, don't just tell", "p": "Instead of describing a format in words, give the model 2-5 real examples of input paired with the exact output you want, then ask for one more. This works because subtle formatting or tone requirements are often much easier to demonstrate than to describe precisely — and industry guidance consistently finds that 2-5 diverse examples outperform either zero examples or ten near-identical ones, since diversity teaches the general pattern rather than one narrow case."}, {"h": "Chain-of-thought: ask for reasoning, not just answers", "p": "For anything involving logic, multi-step reasoning, or judgement calls, explicitly asking the model to reason step by step before giving a final answer measurably improves accuracy on complex tasks. A useful pattern is to ask it to list assumptions, evaluate each one, then give a recommendation — this is more reliable than simply appending 'think step by step' to a hard question, because it structures what kind of reasoning you actually want."}, {"h": "Constraints: rules the output must follow", "p": "Constraints are explicit boundaries — word counts, tone requirements, things to exclude ('do not use any jargon,' 'do not include a conclusion paragraph'). Constraints are especially powerful when combined with chain-of-thought: you can ask the model to reason through a problem privately, then constrain only the final answer to a specific length or format, keeping the reasoning benefit without a bloated response."}], "examples": ["Few-shot for tone matching: give 3 examples of your own past LinkedIn posts, then ask the model to draft a new post 'in this exact voice' — this captures your specific style far better than describing your tone in words.", "Chain-of-thought for a business decision: 'First list 3 assumptions behind this pricing decision. Then evaluate each assumption's risk. Then recommend a price, with your reasoning summarised in 2 sentences.'", "Constraint layering: 'Explain this financial concept in plain English. Do not use any accounting jargon. Limit your answer to 100 words. End with one real-world example.'"], "conclusion": "Few-shot, chain-of-thought, and constraints aren't separate tricks to memorise in isolation — they're three levers you combine depending on what's actually failing in your current prompt: unclear format (few-shot), weak reasoning (chain-of-thought), or an unusable-length or off-tone response (constraints).", "projects": {"overview": "The clearest way to demonstrate mastery of these three techniques is applying all three to one genuinely hard task, not three separate toy examples.", "caseStudy": {"title": "The 'Triple Technique' case study", "body": "Pick one real, moderately complex task (e.g. 'decide which of 3 job offers to accept' or 'plan a 4-week study schedule around a part-time job'). Solve it three ways: once with a plain prompt, once adding chain-of-thought reasoning, and once adding few-shot examples plus constraints. Compare all three outputs and write up which technique improved the result most, and why."}, "ideal": ["A 'Triple Technique' case study comparing plain, chain-of-thought, and few-shot+constraint prompting on one real decision", "A reusable chain-of-thought template for a recurring decision type you face often (e.g. comparing job offers or study plans)"]}, "linkedin": {"task": "Share your Triple Technique case study on LinkedIn: the real decision you tackled, the three prompting approaches, and which one gave you the most useful answer and why.", "why": "This shows applied technique, not just theory — it demonstrates you can escalate your approach when a simple prompt isn't enough, which is precisely the skill gap between casual AI users and people companies actually want to hire for AI-adjacent roles."}}, "1-2": {"intro": "The same prompting skills apply directly to studying, job hunting, and daily work — the only thing that changes is the specific template. This lesson gives you ready-to-adapt prompt templates for summarising material, practising interviews, rewriting resume bullets, and researching a market or company, so you're not starting from a blank page every time.", "purpose": "Skills that stay abstract rarely get used under real deadline pressure. This lesson exists to turn everything from the last two lessons into templates you can literally copy, adapt, and use the next time you're studying for an exam or preparing for an interview.", "outcomes": ["Use a summarisation template to condense dense study material into a usable format", "Use an interview-practice template to get realistic, critical mock interview feedback", "Rewrite a weak resume bullet using a structured before/after prompting pattern", "Adapt any of these templates to a task outside the exact examples given"], "content": [{"h": "Summarising for actual studying, not just shortening", "p": "A good study-summary prompt asks not just for a shorter version, but for a structure that helps you learn: key points, plus open questions you should be able to answer, plus a level of explanation matched to your actual background. Asking for '5 bullets for a first-year student, then 3 questions I should be able to answer after reading this' produces something you can genuinely study from, unlike a generic summary."}, {"h": "Mock interviews that actually challenge you", "p": "The biggest mistake in AI mock interviews is asking for a list of likely questions instead of a real, adversarial back-and-forth. Assigning a strict interviewer role, asking for one question at a time, and explicitly requesting critical feedback after each answer produces something far closer to a real interview than a static question list you passively read."}, {"h": "Resume bullets: before and after, with numbers", "p": "Weak resume bullets describe duties; strong ones show measurable impact. A useful prompting pattern is to give the model your weak, duty-based bullet and ask it to rewrite it with a placeholder for a metric you'll fill in yourself (e.g. '[reduced processing time by X%]') — this keeps you honest (you supply the real number) while getting the structural improvement AI is genuinely good at."}], "examples": ["Study template: 'Explain this concept in 5 bullets for a second-year commerce student, then list 3 questions I should be able to answer after reading this, without giving me the answers yet.'", "Interview template: 'Act as a strict interviewer for a marketing internship. Ask me one question at a time. After each answer, critique it honestly before asking the next question — don't soften your feedback.'", "Resume rewrite: original — 'Responsible for managing social media accounts.' Rewritten — 'Grew Instagram engagement by [X%] over 3 months by shifting posting cadence and content mix based on performance data.'"], "conclusion": "These templates aren't the ceiling of what you can do with AI-assisted studying and job prep — they're a starting floor. Once you're comfortable adapting them, you'll naturally start inventing your own for whatever specific challenge you're facing next.", "projects": {"overview": "The most valuable output of this lesson is a small, personal library of templates you'll actually reuse — not a one-off exercise you forget by next week.", "caseStudy": {"title": "The 'Personal Prompt Toolkit' project", "body": "Build a toolkit of 3 templates adapted to your own life: one for a subject you're currently studying, one for a role you're actually applying to, and one resume bullet rewrite using your real experience. Test each template, refine it based on the output, and save the final versions somewhere you'll actually find them again."}, "ideal": ["A 3-template 'Personal Prompt Toolkit' (study, interview, resume) built around your real coursework and job search", "A before/after set of at least 3 real resume bullets, rewritten using the structured pattern"]}, "linkedin": {"task": "Post your resume bullet before/after examples on LinkedIn (with real, honest numbers only) as a short 'how I improved my resume with AI' post, including the prompting pattern you used.", "why": "This simultaneously improves your actual resume and demonstrates the skill of improving it — a double win that shows both the output (stronger bullets) and the process (structured, honest AI use), which is more convincing to recruiters than either one alone."}}, "1-3": {"intro": "Your first attempt at a prompt is rarely your best one. Professional prompt engineering treats a prompt as a draft to be evaluated and improved, not a one-shot request — and building a small personal library of prompts that already work saves enormous time on recurring tasks.", "purpose": "Without this lesson, every prompting skill you've learned stays a one-off trick you have to reinvent each time. This lesson turns prompting into a repeatable, improvable system you keep for the long term.", "outcomes": ["Evaluate an AI output critically instead of accepting the first response", "Apply a 'self-review' pattern where you ask the AI to critique its own answer", "Identify at least 3 common prompting mistakes and how to avoid each", "Build and maintain a personal library of reusable, tested prompts"], "content": [{"h": "Evaluating output like an editor, not a fan", "p": "After getting a response, ask specific questions: Is this actually accurate? Is anything vague or generic that a real expert would have been more specific about? Did it follow every constraint I gave? Treating the first response as a draft rather than a final answer catches errors and weak spots before you rely on them."}, {"h": "Self-review: a cheap, powerful second pass", "p": "Asking the model to review and critique its own answer — 'review your answer above for accuracy and vagueness, then rewrite anything weak' — consistently improves output quality with very little extra effort. This works because critiquing existing text is often an easier task for a model than generating a perfect answer from scratch on the first pass."}, {"h": "Common mistakes and how to fix your library", "p": "Three frequent mistakes: relying on near-identical examples in few-shot prompts (reducing diversity and generalisation), burying an important instruction in the middle of a very long prompt where it gets under-weighted, and never updating a saved prompt after real-world use reveals its weaknesses. A prompt library should be a living document — every time a prompt fails you in a small way, that's the moment to fix and re-save it, not just work around it that one time."}], "examples": ["Self-review in practice: after getting a draft email from an AI tool, follow up with 'review this for tone — does it sound too formal for a message to a classmate? Rewrite if so.'", "A saved prompt that fails: your 'summarise this article' template works fine for short articles but produces a summary too shallow for a 20-page report — this is the signal to add a length-aware branch to your template, not to abandon templates altogether.", "A basic prompt library entry format: task name, the prompt text, one note on when it works well, one note on its known limitation — simple enough to actually maintain."], "conclusion": "The habit of evaluating, refining, and saving prompts is what separates someone who occasionally gets lucky with AI from someone who reliably gets good results — and it's a habit that gets more valuable the more you use AI tools in your daily work.", "projects": {"overview": "This is the capstone project for the whole Prompt Engineering module — it should combine everything from RCTF through self-review into one finished, reusable asset.", "caseStudy": {"title": "The 'Personal Prompt Library v1' project", "body": "Compile at least 8 of your best prompts from this entire module (studying, interviews, resumes, and anything else you've built) into a single organised document. For each, include the prompt text, an example output, and one note on its known limitation. Test the whole library on 2 brand-new tasks it wasn't originally built for, and record how well it generalised."}, "ideal": ["A finished 'Personal Prompt Library v1' with at least 8 tested, documented prompts", "A short reflection comparing your very first prompt from Lesson 1 to your best prompt now, showing concrete improvement"]}, "linkedin": {"task": "Post a short 'lessons learned' reflection on LinkedIn: your very first weak prompt from this course versus your best prompt now, plus one mistake you made along the way and what fixed it.", "why": "A visible growth story — not just a finished skill — is unusually compelling on LinkedIn because it's honest and specific rather than a generic skills claim, and it signals to recruiters that you can learn and iterate quickly, which matters more to most employers than already knowing everything on day one."}}};
async function openL(id){

async function aiQs(k,T,n){

    const v=(Array.isArray(r)?r:[]).filter(okQ);if(v.length>=6)return v.slice(0,n)}catch(e){}}
  return[]}

async function startTest(i){
  busy="t"+i;render();const T=TESTS[i];
  const qa=sh(QT).slice(0,10).map(f=>({...f(i),s:0}));
  const [lr,vb]=await Promise.all([aiQs(1,T,10),aiQs(2,T,10)]);
  const src=a=>a.length>=10?"AI-generated":a.length?"AI + backup bank":"backup bank";
  const L=lr.map(q=>({...q,s:1})),V=vb.map(q=>({...q,s:2})),lt=sh(LT),vt=sh(VB);
  let a=0;while(L.length<10)L.push({...lt[a++%lt.length](i),s:1});
  a=0;while(V.length<10)V.push({...vt[a++%vt.length],s:2});
  quiz={i,nm:T.n,qs:[...qa,...L,...V],ans:{},flag:{},idx:0,sub:false,confirming:false,left:30*60,src:`Quant: verified · LRDI: ${src(lr)} · Verbal: ${src(vb)}`};
  busy="";render();scrollTo(0,0);qArm();
}
async function importPYQ(){

function qArm(){
  clearInterval(quiz.timerId);if(!quiz||quiz.custom)return;

    if(!quiz||quiz.sub)return clearInterval(quiz.timerId);

const fmtTime=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")}:${String(Math.max(0,s)%60).padStart(2,"0")}`;
function qGoto(idx){quiz.idx=Math.max(0,Math.min(quiz.qs.length-1,idx));quiz.confirming=false;renderQuiz()}
function qToggleFlag(){quiz.flag[quiz.idx]=!quiz.flag[quiz.idx];renderQuiz()}

function qAskSubmit(){quiz.confirming=true;renderQuiz()}
function finalizeSubmit(){clearInterval(quiz.timerId);quiz.sub=true;
  if(!quiz.custom){const t=quiz.qs.filter((q,k)=>quiz.ans[k]===q.a).length,s=R();if(S.tests[quiz.i]==null||t>S.tests[quiz.i])S.tests[quiz.i]=t;commit(s,`${quiz.nm} completed — ${t}/${quiz.qs.length}`)}

}

    let last="";qs.forEach((q,k)=>{if(lab(q)!==last){last=lab(q);h+=`<div class="label" style="margin:16px 2px 6px">${esc(last)}</div>`}
      h+=`<div class="card"><b>Q${k+1}.</b> ${esc(q.q).replace(/\n/g,"<br>")}`+q.o.map((o,j)=>{let c="opt";if(j===q.a)c+=" ok";else if(ans[k]===j)c+=" no";return `<div class="${c}"><span class="optlet">${"ABCD"[j]||j+1}</span>${esc(o)}</div>`}).join("")+`<p class="mut" style="margin-top:6px">${esc(q.e)}</p></div>`});

  const q=qs[idx],answered=Object.keys(ans).length,flagged=Object.values(flag).filter(Boolean).length;

  <div class="pal">${qs.map((qq,k)=>`<button class="${k===idx?'cur':''} ${ans[k]!=null?'ans':''} ${flag[k]?'flag':''}" onclick="qGoto(${k})">${k+1}</button>`).join("")}</div></div>`;
  if(quiz.confirming){h+=`<div class="card" style="border-color:var(--ac)"><h3>Submit test?</h3><p class="mut" style="margin-top:6px">${qs.length-answered} unanswered, ${flagged} flagged for review.</p><div class="row" style="margin-top:10px;justify-content:flex-start;gap:10px"><button class="p" onclick="finalizeSubmit()">Submit now</button><button class="s" onclick="quiz.confirming=false;renderQuiz()">Keep reviewing</button></div></div>`}
  h+=`<div class="card"><div class="label">${lab(q)} · Question ${idx+1} of ${qs.length}</div><h3 style="margin-top:8px;font-size:16px">${esc(q.q).replace(/\n/g,"<br>")}</h3>`+
  q.o.map((o,j)=>`<button class="opt ${ans[idx]===j?'sel':''}" onclick="qAnswer(${j})"><span class="optlet">${"ABCD"[j]||j+1}</span>${esc(o)}</button>`).join("")+
  `<div class="row" style="margin-top:14px"><button class="s" onclick="qGoto(${idx-1})" ${idx===0?"disabled":""}>Previous</button><button class="s" onclick="qToggleFlag()">${ic('flag','ic')} ${flag[idx]?"Unflag":"Mark for review"}</button>${idx<qs.length-1?`<button class="p" onclick="qGoto(${idx+1})">Next</button>`:`<button class="p" onclick="qAskSubmit()">Submit test</button>`}</div></div>`;
  $("#app").innerHTML=h;
}
